<!DOCTYPE html>
<html data-theme="light"><head><meta charset="utf-8">
<style>/*SITE_CSS*/
html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
.card { width: 1200px; height: 630px; border-radius: 0; border: 0; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; background: var(--bg); }
.bar { display: flex; gap: 10px; }
.bar i { width: 56px; height: 10px; border-radius: 5px; display: block; }
h1 { font-size: 78px; line-height: 1.06; letter-spacing: -0.035em; margin: 0; max-width: 980px; }
p { font-size: 32px; color: var(--text-secondary); margin: 22px 0 0; line-height: 1.3; }
.foot { font-size: 28px; font-weight: 600; color: var(--text-primary); display: flex; justify-content: space-between; }
.foot span { color: var(--text-muted); font-weight: 500; }
</style></head>
<body><div class="card">
  <div class="bar"><i style="background:var(--series-1)"></i><i style="background:var(--series-2)"></i><i style="background:var(--series-3)"></i><i style="background:var(--series-4)"></i><i style="background:var(--series-5)"></i></div>
  <div>
    <h1>Which JavaScript table library should you use?</h1>
    <p>Same table, same 500,000 rows, nine builds</p>
  </div>
  <div class="foot">Tables Bakeoff <span>tables.datahub.io</span></div>
</div></body></html>
