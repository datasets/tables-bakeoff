<!DOCTYPE html>
<html data-theme="light"><head><meta charset="utf-8">
<style>/*SITE_CSS*/
html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
.card { width: 1200px; height: 630px; border-radius: 0; border: 0; padding: 64px 0 56px 72px; display: grid; grid-template-columns: 560px 1fr; grid-template-rows: auto 1fr auto; column-gap: 48px; background: var(--bg); overflow: hidden; position: relative; }
.bar { grid-column: 1; }
.text { grid-column: 1; grid-row: 2; align-self: center; }
.foot { grid-column: 1; grid-row: 3; }
.shot { grid-column: 2; grid-row: 1 / 4; align-self: center; width: 760px; margin-top: 24px; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: 0 24px 60px -24px rgba(0,0,0,.45); transform: translateX(12px); }
.shot img { display: block; width: 100%; height: auto; }
.bar { display: flex; gap: 10px; }
.bar i { width: 56px; height: 10px; border-radius: 5px; display: block; }
h1 { font-size: 58px; line-height: 1.06; letter-spacing: -0.03em; margin: 0; }
p { font-size: 26px; color: var(--text-secondary); margin: 20px 0 0; line-height: 1.3; max-width: 540px; }
.foot { font-size: 24px; font-weight: 600; color: var(--text-primary); display: flex; justify-content: space-between; }
.foot span { color: var(--text-muted); font-weight: 500; }
</style></head>
<body><div class="card">
  <div class="bar"><i style="background:var(--series-1)"></i><i style="background:var(--series-2)"></i><i style="background:var(--series-3)"></i><i style="background:var(--series-4)"></i><i style="background:var(--series-5)"></i></div>
  <div class="text">
    <h1>Which JavaScript table library should you use?</h1>
    <p>The same table nine times, 1,000 to 500,000 rows, and a pick for each job</p>
  </div>
  <div class="foot">Tables Bakeoff <span>tables.datahub.io</span></div>
  <div class="shot"><img src="/*HERO_IMG*/" alt=""></div>
</div></body></html>
