<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TanStack Table — Tables Bakeoff</title>
<meta property="og:image" content=""><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:title" content="">
<meta property="og:description" content="">
<link rel="stylesheet" href="/src/harness/site.css">
<style>
  /* Headless means every one of these rules is ours. None of it comes from
     the library — which is also why the demo needs no theming API: the
     tokens below are the same site variables every other demo's chrome uses. */
  .tst-scroll { height: 100%; overflow: auto; }
  .tst {
    border-collapse: collapse;
    table-layout: fixed;
    font-size: var(--table-font-size);
  }
  .tst th, .tst td {
    padding: 5px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tst th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--table-header-bg);
    font-weight: 600;
    cursor: pointer;
    user-select: none;
  }
  .tst th:hover { color: var(--accent); }
  .tst td { font-variant-numeric: tabular-nums; }
  /* Spacer cells stand in for the windowed-out rows and columns. */
  .tst .pad { padding: 0; border: 0; }
  .tst .sort { color: var(--accent); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/demos/tanstack/main.jsx"></script>
</body>
</html>
